name: Build predict_server.exe (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'predict_server.py'
      - 'main.py'
      - 'requirements_server.txt'
      - '.github/workflows/build_exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_server.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        run: |
          python -m PyInstaller --onefile --noconsole `
            --name predict_server `
            predict_server.py

      - name: Move exe to repo root and commit
        run: |
          copy dist\predict_server.exe predict_server.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predict_server.exe
          git diff --cached --quiet && echo "Pas de changement" || git commit -m "ci: rebuild predict_server.exe [skip ci]"
          git push
