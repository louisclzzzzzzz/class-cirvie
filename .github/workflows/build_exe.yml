name: Build predict_server.exe (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'predict_server.py'
      - 'main.py'
      - 'models/**'
      - 'requirements_server.txt'
      - '.github/workflows/build_exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_server.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        run: |
          python -m PyInstaller --onefile --noconsole `
            --name predict_server `
            --add-data "models\model_fast_omv.pkl;." `
            --add-data "models\model_fast_service.pkl;." `
            --add-data "models\model_fast_origine.pkl;." `
            --add-data "models\nom_service.json;." `
            predict_server.py

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: predict_server-windows
          path: dist/predict_server.exe
          retention-days: 90
