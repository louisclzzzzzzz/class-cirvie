name: Build predict_server.exe (Windows)

on:
  push:
    paths:
      - 'predict_server.py'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/build_exe.yml'
  workflow_dispatch:   # déclenchement manuel depuis l'onglet Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_server.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        run: |
          python -m PyInstaller --onefile --noconsole `
            --name predict_server `
            --add-data "model_fast_omv.pkl;." `
            --add-data "model_fast_service.pkl;." `
            --add-data "model_fast_origine.pkl;." `
            --add-data "nom_service.json;." `
            predict_server.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: predict_server_windows
          path: dist/predict_server.exe
          retention-days: 30
